<!doctype html>
<!-- GRAVE ERROR — DESIGN OPTION B "REQUIEM": atmospheric minimal. Drifting fog, one haunting focal shape, sparse type, subtle countdown. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAVE ERROR</title>
<meta name="description" content="GRAVE ERROR — an undead survival horror game by Atheos Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07090b;--mist:#aeb6bd;--pale:#e9edf1;--dim:#6a727b;--accent:#9db4c0;--line:#1a2026}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--mist);font-family:"Inter",sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden}
  /* deep vertical gloom + faint moon glow */
  body::before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(80% 60% at 50% 18%,#12181d 0%,#090b0e 55%,#050607 100%)}
  /* drifting fog layers */
  .fog{position:fixed;left:-30%;width:160%;height:70vh;z-index:-2;pointer-events:none;
    background:radial-gradient(closest-side,rgba(160,175,185,.10),transparent 70%);filter:blur(8px)}
  .fog.f1{top:20%;animation:drift 34s linear infinite}
  .fog.f2{top:48%;height:60vh;opacity:.7;animation:drift 52s linear infinite reverse}
  @keyframes drift{0%{transform:translateX(-8%)}50%{transform:translateX(8%)}100%{transform:translateX(-8%)}}
  .badge{position:fixed;top:12px;right:12px;z-index:10;font-size:10px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);background:rgba(0,0,0,.4);padding:5px 9px;border-radius:20px}
  .stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;position:relative}
  /* haunting focal shape: a faint headstone / cross silhouette */
  .icon{width:clamp(70px,12vw,110px);height:auto;margin-bottom:40px;opacity:.9;filter:drop-shadow(0 0 30px rgba(157,180,192,.25))}
  .kicker{font-size:12px;letter-spacing:.55em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(3rem,13vw,7rem);letter-spacing:.14em;color:var(--pale);line-height:1}
  h1 .e{font-weight:300;font-style:italic;opacity:.85;letter-spacing:.1em}
  .rule{width:1px;height:56px;background:linear-gradient(var(--accent),transparent);margin:34px 0}
  .line{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(1.1rem,3vw,1.6rem);color:var(--mist);max-width:30ch}
  .count{margin-top:46px;display:flex;gap:26px;color:var(--pale)}
  .count div{display:flex;flex-direction:column;align-items:center;min-width:52px}
  .count b{font-family:"Cormorant Garamond",serif;font-size:2rem;font-weight:500;letter-spacing:.05em}
  .count span{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-top:4px}
  .cta{margin-top:48px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  a.btn{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;padding:14px 26px;border-radius:30px;transition:.25s}
  .b1{color:#0a0d0f;background:var(--accent)}
  .b1:hover{background:#c3d3db}
  .b2{color:var(--mist);border:1px solid var(--line)}
  .b2:hover{border-color:var(--accent);color:var(--pale)}
  .foot{padding:64px 24px 70px;text-align:center;border-top:1px solid var(--line)}
  form{display:flex;gap:8px;max-width:400px;margin:0 auto 10px;flex-wrap:wrap;justify-content:center}
  input{flex:1;min-width:200px;background:transparent;border:1px solid var(--line);color:var(--pale);padding:13px 16px;border-radius:30px;font-family:"Inter";font-weight:300}
  input:focus{outline:none;border-color:var(--accent)}
  .thanks{color:var(--accent);font-family:"Cormorant Garamond";font-style:italic;font-size:1.1rem;min-height:1.4em}
  .studio{color:var(--dim);font-size:.85rem;letter-spacing:.1em;margin-top:30px}
  .studio a{color:var(--mist);text-decoration:none;border-bottom:1px solid var(--accent)}
  .studio a:hover{color:var(--pale)}
  .social{display:flex;gap:24px;justify-content:center;margin-top:16px}
  .social a{color:var(--dim);text-decoration:none;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
  .social a:hover{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){.fog{animation:none}}
</style>
</head>
<body>
<div class="badge">PREVIEW MOCKUP · OPTION B — REQUIEM</div>
<div class="fog f1"></div><div class="fog f2"></div>

<main class="stage">
  <svg class="icon" viewBox="0 0 100 130" fill="none" aria-hidden="true">
    <path d="M50 6c-16 0-27 11-27 27v84h54V33C77 17 66 6 50 6Z" fill="#0c1013" stroke="#9db4c0" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M50 40v40M34 56h32" stroke="#9db4c0" stroke-opacity=".55" stroke-width="2"/>
  </svg>
  <p class="kicker">Atheos Studios presents</p>
  <h1>GRAVE <span class="e">ERROR</span></h1>
  <div class="rule"></div>
  <p class="line">What rises when the world forgets how to end?</p>
  <div class="count" id="count" aria-label="Approximate time until reveal">
    <div><b id="d">--</b><span>Days</span></div>
    <div><b id="h">--</b><span>Hours</span></div>
    <div><b id="m">--</b><span>Minutes</span></div>
  </div>
  <div class="cta">
    <a class="btn b1" href="#foot">Get Notified</a>
    <a class="btn b2" href="#" aria-label="Wishlist on Steam (placeholder)">Wishlist on Steam</a>
  </div>
</main>

<footer class="foot" id="foot">
  <form id="signup">
    <input type="email" name="email" placeholder="Enter your email" required aria-label="Email address">
    <button class="btn b1" type="submit">Notify Me</button>
  </form>
  <p class="thanks" id="thanks" role="status"></p>
  <p class="studio">An <a href="https://atheosstudios.com">Atheos Studios</a> game</p>
  <div class="social"><a href="#">X</a><a href="#">Discord</a><a href="#">YouTube</a></div>
</footer>

<script>
  // gentle placeholder countdown (~90 days out) — purely atmospheric
  const target = new Date().getTime() + 90*864e5;
  function tick(){
    const t = target - new Date().getTime();
    document.getElementById("d").textContent = Math.max(0,Math.floor(t/864e5));
    document.getElementById("h").textContent = Math.max(0,Math.floor(t%864e5/36e5));
    document.getElementById("m").textContent = Math.max(0,Math.floor(t%36e5/6e4));
  }
  tick(); setInterval(tick,60000);
  document.getElementById("signup").addEventListener("submit",function(e){
    e.preventDefault();
    document.getElementById("thanks").textContent = "We'll find you when it's time.";
    this.reset();
  });
</script>
</body>
</html>
